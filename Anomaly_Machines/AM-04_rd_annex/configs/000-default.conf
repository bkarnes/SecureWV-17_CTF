# DIRECTIVE ZERO — AM-04 R&D Annex Apache vhost
#
# Basic Auth protects the root with a verb-bypass misconfig:
# <Limit GET POST HEAD> requires valid-user, but non-standard verbs
# (e.g. BOB, OPTIONS, PROPFIND) bypass auth and hit PHP directly.
# This is the foothold discovery step — players who try a non-standard
# verb get the page content instead of a 401.

<VirtualHost *:80>
    ServerName rd-annex
    ServerAdmin admin@construct.local
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # Basic Auth with verb bypass — only standard verbs require auth.
        AuthType Basic
        AuthName "index.php"
        AuthUserFile /var/www/html/.htpasswd
        <Limit GET POST HEAD>
            Require valid-user
        </Limit>
    </Directory>

    # scriptz/ directory: listing enabled, auth bypassed via .htaccess
    <Directory /var/www/html/scriptz>
        Options +Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/rd_annex_error.log
    CustomLog ${APACHE_LOG_DIR}/rd_annex_access.log combined
</VirtualHost>