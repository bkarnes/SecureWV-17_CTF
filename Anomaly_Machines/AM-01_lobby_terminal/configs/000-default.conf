# DIRECTIVE ZERO — AM-01 Apache vhost
# Phosphor-green terminal aesthetic is delivered by the PHP app's own
# inline CSS; this vhost just sets the docroot and enables .php handling.

<VirtualHost *:80>
    ServerName lobby-terminal
    ServerAdmin admin@construct.local
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # The enrollment app lives at /app/ — served as http://host/app/index.php
    <Directory /var/www/html/app>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/lobby_error.log
    CustomLog ${APACHE_LOG_DIR}/lobby_access.log combined
</VirtualHost>