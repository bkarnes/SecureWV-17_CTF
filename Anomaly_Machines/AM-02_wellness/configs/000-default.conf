# DIRECTIVE ZERO — AM-02 Apache vhost (decoy on :8080)
# Serves a static QUORUM "this facility does not exist" page. No backend,
# no forms — pure flavor and misdirection.

<VirtualHost *:8080>
    ServerName wellness-observation
    ServerAdmin admin@construct.local
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/wellness_error.log
    CustomLog ${APACHE_LOG_DIR}/wellness_access.log combined
</VirtualHost>