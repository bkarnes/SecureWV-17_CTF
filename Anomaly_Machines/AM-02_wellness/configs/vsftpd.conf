# DIRECTIVE ZERO — AM-02 vsftpd config
# Anonymous-only FTP. The hidden .wellness/ dir under public/ holds the
# stolen SSH key. Players use `ls -la` to spot it.

listen=YES
listen_ipv6=NO

anonymous_enable=YES
local_enable=NO
write_enable=NO
anon_upload_enable=NO
anon_mkdir_write_enable=NO
anon_other_write_enable=NO

anon_root=/home/wellness/ftp

# Hide the FTP banner slightly — QUORUM flavor.
ftpd_banner=QUORUM Construct — authorized transfer point only.

# Log connections (Director visibility).
xferlog_enable=YES
xferlog_std_format=YES

# Security: chroot anonymous users to anon_root.
secure_chroot_dir=/var/run/vsftpd
allow_writeable_chroot=YES

# Run standalone.
background=NO

# ── Passive mode ────────────────────────────────────────────────────────────
# Without these, vsftpd advertises an unroutable container-internal IP in
# PASV/EPSV, breaking data connections from outside the container. Force
# PASV (not EPSV) and pin a port range so the compose file can publish them.
pasv_enable=YES
pasv_min_port=30000
pasv_max_port=30009
pasv_address=127.0.0.1
# Disable IPv6 EPSV (avoids ::1 unroutable from the client).
listen_ipv6=NO