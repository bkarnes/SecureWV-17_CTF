# DIRECTIVE ZERO — AM-05 RabbitMQ config
# Misconfig: allow the guest user to connect from any host (not just
# localhost). This lets the archive-consumer (on the internal Docker
# network) connect to RabbitMQ as guest, and also lets players who get
# a shell on archive connect from localhost.

loopback_users = none

# Default port
listeners.tcp.default = 5672

# Management plugin (disabled to keep the attack surface focused)
management.listener.port = 15672