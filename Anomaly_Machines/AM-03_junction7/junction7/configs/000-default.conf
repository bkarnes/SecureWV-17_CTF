# DIRECTIVE ZERO — AM-03 junction7 Apache vhost
# Serves the main Junction 7 page at / and the LFI-vulnerable bolo.php
# at /junction-bolo/.

<VirtualHost *:80>
    ServerName junction7
    ServerAdmin admin@construct.local
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # The junction-bolo/ dir is the hidden LFI target. No direct link from
    # the main page — players discover it via the routing status service
    # on port 9001. Directory listing is off so the path isn't browseable.
    <Directory /var/www/html/junction-bolo>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex bolo.php
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/junction7_error.log
    CustomLog ${APACHE_LOG_DIR}/junction7_access.log combined
</VirtualHost>